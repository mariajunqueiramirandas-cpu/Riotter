[package]
name = "riot_data"
description = "RON scenarios, tunables and Tiled maps → riot_sim types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The facade over the riot_data_* crates; it adds only loading a scenario
# with its map and tunables, so it needs no serde of its own.
[dependencies]
riot_data_core.workspace = true
riot_data_tiled.workspace = true
riot_data_citygen.workspace = true
riot_data_tunables.workspace = true
riot_data_scenario.workspace = true
# Only definitions: `MapDef`, `RiotSetup`, `Tunables` and, for
# `generated:testkit` maps, `testkit::district`.
riot_sim.workspace = true

[dev-dependencies]
# The tests build worlds (`riot_sim::World`); `gen_data --nav` builds the
# nav map (`riot_sim::map::Map`).
riot_sim.workspace = true

[lints]
workspace = true
